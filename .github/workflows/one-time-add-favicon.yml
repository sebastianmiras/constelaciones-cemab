name: One-time add CEMAB favicon

on:
  push:
    paths:
      - '.github/workflows/one-time-add-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add favicon links to site HTML
        shell: python
        run: |
          from pathlib import Path

          def insert_after_theme_color(html, favicon_line, path):
              if 'cemab-favicon.png' in html:
                  return html, False
              lines = html.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if '<meta name="theme-color"' in line:
                      lines.insert(i + 1, favicon_line)
                      return ''.join(lines), True
              raise RuntimeError(f'No se encontró theme-color en {path}')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, changed = insert_after_theme_color(
              html,
              '  <link rel="icon" type="image/png" href="assets/cemab-favicon.png">\n',
              index
          )
          if changed:
              index.write_text(html, encoding='utf-8')

          count = 0
          for path in Path('.').glob('*/*_constelacion.html'):
              html = path.read_text(encoding='utf-8')
              html, changed = insert_after_theme_color(
                  html,
                  '  <link rel="icon" type="image/png" href="../assets/cemab-favicon.png">\n',
                  path
              )
              if changed:
                  path.write_text(html, encoding='utf-8')
                  count += 1
          print(f'Constelaciones actualizadas: {count}')

      - name: Commit favicon links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html */*_constelacion.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add CEMAB favicon to site pages"
          git push origin HEAD:main
