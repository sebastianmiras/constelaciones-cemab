name: One-time add reference codes

on:
  push:
    paths:
      - '.github/workflows/one-time-add-ref-codes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-reference-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add persistent reference codes and update UI
        shell: python
        run: |
          import csv
          import io
          import pathlib
          import re

          prefixes = {
              'andruetto': 'AND',
              'benedetti': 'BEN',
              'eudave': 'EUD',
              'ferrada': 'FER',
              'frankel': 'FRA',
              'glantz': 'GLA',
              'iwasaki': 'IWA',
              'murillo': 'MUR',
              'neuman': 'NEU',
              'shua': 'SHU',
              'soderguit': 'SOD',
              'valenzuela': 'VAL',
              'wolf': 'WOL',
          }

          for folder, prefix in prefixes.items():
              path = pathlib.Path(folder) / f'{folder}_nodos.csv'
              raw = path.read_text(encoding='utf-8-sig')
              rows = list(csv.DictReader(io.StringIO(raw)))
              if not rows:
                  raise RuntimeError(f'CSV vacío: {path}')

              fieldnames = list(rows[0].keys())
              if 'ref_code' not in fieldnames:
                  fieldnames.insert(fieldnames.index('id') + 1, 'ref_code')

              used = set()
              max_num = 0
              for row in rows:
                  code = (row.get('ref_code') or '').strip()
                  if row.get('type') == 'reference' and code:
                      if code in used:
                          raise RuntimeError(f'Código duplicado {code} en {path}')
                      used.add(code)
                      m = re.fullmatch(re.escape(prefix) + r'-(\d+)', code)
                      if m:
                          max_num = max(max_num, int(m.group(1)))

              next_num = 1 if not used else max_num + 1
              for row in rows:
                  if row.get('type') == 'reference':
                      if not (row.get('ref_code') or '').strip():
                          while f'{prefix}-{next_num}' in used:
                              next_num += 1
                          row['ref_code'] = f'{prefix}-{next_num}'
                          used.add(row['ref_code'])
                          next_num += 1
                  else:
                      row['ref_code'] = ''

              out = io.StringIO(newline='')
              writer = csv.DictWriter(out, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
              path.write_text('\ufeff' + out.getvalue(), encoding='utf-8')

          js_path = pathlib.Path('assets/constellation.js')
          js = js_path.read_text(encoding='utf-8')

          old_counter = '''    const referenceIndex = nodes.filter(node => node.type === "reference").findIndex(node => node.id === d.id) + 1;\n    const referenceTotal = nodes.filter(node => node.type === "reference").length;\n    document.querySelector("#panel-count").textContent = `${String(referenceIndex).padStart(2, "0")} / ${String(referenceTotal).padStart(2, "0")}`;'''
          new_counter = '''    document.querySelector("#panel-count").textContent = d.ref_code || "—";'''
          if old_counter not in js:
              raise RuntimeError('No se encontró el bloque actual del contador en constellation.js')
          js = js.replace(old_counter, new_counter)

          old_search = 'normalize(`${node.label} ${node.note} ${node.group}`).includes(query)'
          new_search = 'normalize(`${node.ref_code || ""} ${node.label} ${node.note} ${node.group}`).includes(query)'
          if old_search not in js:
              raise RuntimeError('No se encontró el bloque de búsqueda esperado en constellation.js')
          js = js.replace(old_search, new_search)
          js_path.write_text(js, encoding='utf-8')

          for html_path in pathlib.Path('.').glob('*/*_constelacion.html'):
              html = html_path.read_text(encoding='utf-8')
              html = html.replace('<div class="panel-index">Referencia seleccionada <span id="panel-count">—</span></div>', '<div class="panel-index"><span id="panel-count">—</span></div>')
              html = html.replace('../assets/constellation.js?v=2', '../assets/constellation.js?v=3')
              html_path.write_text(html, encoding='utf-8')

          # Validación final
          for folder, prefix in prefixes.items():
              path = pathlib.Path(folder) / f'{folder}_nodos.csv'
              rows = list(csv.DictReader(io.StringIO(path.read_text(encoding='utf-8-sig'))))
              refs = [r for r in rows if r.get('type') == 'reference']
              codes = [r.get('ref_code', '') for r in refs]
              if any(not code for code in codes):
                  raise RuntimeError(f'Hay referencias sin código en {path}')
              if len(codes) != len(set(codes)):
                  raise RuntimeError(f'Hay códigos duplicados en {path}')
              if any(not re.fullmatch(re.escape(prefix) + r'-\d+', code) for code in codes):
                  raise RuntimeError(f'Formato de código incorrecto en {path}')
              print(f'{folder}: {len(refs)} referencias, {codes[0]} … {codes[-1]}')

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellation.js */*_nodos.csv */*_constelacion.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add stable reference codes to constellations"
          git push origin HEAD:main
