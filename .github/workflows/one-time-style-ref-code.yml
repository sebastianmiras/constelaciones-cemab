name: One-time style reference code

on:
  push:
    paths:
      - '.github/workflows/one-time-style-ref-code.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  style-reference-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Emphasize reference code and bump CSS cache key
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/constellation.css')
          css = css_path.read_text(encoding='utf-8')
          old = '.panel-index { display: flex; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--line); color: var(--muted); font: 9px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }'
          new = '.panel-index { display: flex; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--line); color: var(--text); font: 500 12px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .12em; }'
          if old not in css:
              raise RuntimeError('No se encontró la regla .panel-index esperada')
          css_path.write_text(css.replace(old, new), encoding='utf-8')

          changed = 0
          for html_path in Path('.').glob('*/*_constelacion.html'):
              html = html_path.read_text(encoding='utf-8')
              updated = html.replace('../assets/constellation.css?v=2', '../assets/constellation.css?v=3')
              if updated != html:
                  html_path.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'HTML actualizados: {changed}')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellation.css */*_constelacion.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Emphasize stable reference codes in panels"
          git push origin HEAD:main
